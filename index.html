<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0a0a"><link rel="manifest" href="manifest.json"><title>MILITAR Player</title><style>:root{--bg:#0a0a0a;--surface:#141414;--gold:#c9a84c;--text:#e8e8e8;--text-muted:#888}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.player{width:100%;max-width:420px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.7)}.header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid #2a2a2a}.brand-name{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--gold)}.now-playing{padding:28px 24px 20px;text-align:center}.cover{width:180px;height:180px;margin:0 auto 20px;border-radius:16px;background:#1c1c1c;display:flex;flex-direction:column;align-items:center;justify-content:center}.clock-time{font-size:36px;font-weight:600;color:var(--gold)}.track-title{font-size:17px;font-weight:600;margin-bottom:4px}.track-artist{font-size:13px;color:var(--text-muted)}.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 24px 28px}.play-btn{width:56px;height:56px;border-radius:50%;background:var(--gold);border:none;color:#0a0a0a;font-size:24px;cursor:pointer}@media(max-width:480px){body{padding:12px}.cover{width:140px;height:140px}.clock-time{font-size:28px}}</style></head><body><div class="player"><div class="header"><div class="brand-name">MILITAR AUDIO PLAYER</div></div><div class="now-playing"><div class="cover"><div class="clock-time" id="clock">00:00</div></div><div class="track-title">Niciun fișier selectat</div><div class="track-artist">Importă muzică pentru a începe (versiune slim - folosește fișierele complete din artifacts)</div></div><div class="controls"><button class="play-btn">▶</button></div></div><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}setInterval(()=>{const n=new Date();document.getElementById('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');},1000);</script></body></html>
