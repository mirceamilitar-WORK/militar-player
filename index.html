<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MILITAR">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Player audio offline. Importă muzica de pe dispozitiv și ascult-o fără cont.">
  <link rel="manifest" href="manifest.json">
  <title>MILITAR Player</title>
  <style>
    :root { --bg:#090909; --surface:#121212; --surface-2:#1c1c1c; --border:#2c2c2c; --fg:#f3f1ea; --muted:#8d8a82; --gold:#c9a84c; --gold-dim:#8a7335; --ink:#0a0a0a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; background:var(--bg); color:var(--fg); font-family:"Segoe UI", system-ui, sans-serif; }
    body { background-image:radial-gradient(ellipse at 18% 0%, rgba(201,168,76,.10), transparent 42%); }
    button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
    button:disabled { opacity:.4; cursor:default; }
    .wrap { max-width:64rem; margin:0 auto; min-height:100dvh; padding:12px 12px max(12px, env(safe-area-inset-bottom)); display:grid; gap:16px; }
    @media (min-width:960px) { .wrap { grid-template-columns:26rem 1fr; padding:32px 24px; } }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
    .head, .plist-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); }
    .brand { font-family:Georgia, Palatino, serif; letter-spacing:.28em; color:var(--gold); font-size:18px; }
    .sub { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .ghost { height:44px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); padding:0 12px; display:inline-flex; align-items:center; gap:8px; font-size:14px; }
    .ghost:hover, .icon:hover { border-color:var(--gold-dim); }
    .stage { padding:24px 20px 20px; }
    .cover { width:min(100%, 16rem); margin:0 auto; aspect-ratio:1; border-radius:16px; border:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
    .clock { font-size:36px; font-weight:500; letter-spacing:.04em; color:var(--gold); font-variant-numeric:tabular-nums; }
    .meta { margin-top:8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .day { margin-top:4px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dim); }
    .bars { margin-top:16px; height:40px; width:100%; display:flex; align-items:flex-end; gap:4px; }
    .bars i { flex:1; height:100%; border-radius:999px; background:rgba(201,168,76,.4); transform-origin:bottom; transform:scaleY(.16); }
    .now { margin-top:20px; text-align:center; min-height:56px; }
    .now h1 { font-size:18px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .now p { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .seek { margin-top:16px; height:20px; cursor:pointer; position:relative; }
    .track { position:absolute; left:0; right:0; top:8px; height:4px; border-radius:999px; background:var(--surface-2); }
    .fill { height:100%; width:0; border-radius:999px; background:var(--gold); }
    .times { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .controls { margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .icon { width:44px; height:44px; border-radius:999px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
    .icon.on { color:var(--gold); }
    .play { width:56px; height:56px; border-radius:999px; background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; }
    .play:active, .icon:active { transform:scale(.96); }
    .vol { margin-top:12px; display:flex; align-items:center; gap:12px; padding:0 8px; }
    .vol input { width:100%; accent-color:var(--gold); }
    .note { margin-top:12px; text-align:center; color:var(--muted); font-size:14px; }
    .note.err { color:var(--gold); }
    .search { margin:16px 16px 0; height:44px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; gap:8px; padding:0 12px; }
    .search input { flex:1; background:transparent; border:none; color:var(--fg); outline:none; font:inherit; }
    ul { list-style:none; overflow:auto; padding:8px 8px 12px; }
    li { display:flex; align-items:center; gap:12px; border-radius:16px; padding:8px 12px; }
    li.active, li:hover { background:var(--surface-2); }
    li button.row { flex:1; min-width:0; display:flex; gap:12px; text-align:left; align-items:center; }
    .idx { width:24px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    li.active .idx, li.active .ttl { color:var(--gold); }
    .ttl { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .art { display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dur { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .empty { padding:40px 16px; text-align:center; color:var(--muted); font-size:14px; }
    .empty strong { display:block; color:var(--fg); font-weight:500; margin-bottom:8px; }
    .cta { margin-top:16px; height:44px; border-radius:999px; background:var(--gold); color:var(--ink); padding:0 16px; font-weight:500; }
    .foot { border-top:1px solid var(--border); padding:12px 20px; color:var(--muted); font-size:12px; }
    .danger { height:40px; border-radius:999px; background:var(--gold); color:var(--ink); padding:0 12px; font-size:14px; font-weight:500; }
    .linkish { height:40px; color:var(--muted); font-size:14px; padding:0 12px; }
    svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .play svg { width:24px; height:24px; }
    .hidden { display:none; }
    @media (max-width:480px) { .clock { font-size:28px; } .dosar-label { display:none; } }
  </style>
</head>
<body>
  <div class="wrap" id="drop">
    <section class="card">
      <header class="head">
        <div>
          <div class="brand">MILITAR</div>
          <div class="sub">Audio Player</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="ghost" id="importBtn" type="button">Importă</button>
          <button class="ghost" id="dirBtn" type="button">Dosar</button>
        </div>
      </header>
      <div class="stage">
        <div class="cover">
          <div class="clock" id="clock">--:--:--</div>
          <div class="meta" id="date">—</div>
          <div class="day" id="day">—</div>
          <div class="bars" id="bars"></div>
        </div>
        <div class="now">
          <h1 id="title">Se încarcă biblioteca</h1>
          <p id="artist">Piesele rămân doar pe acest dispozitiv</p>
        </div>
        <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Poziție în piesă" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="track"><div class="fill" id="fill"></div></div>
        </div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="controls">
          <button class="icon" id="shuffle" type="button" aria-label="Redare aleatorie"></button>
          <button class="icon" id="prev" type="button" aria-label="Piesa anterioară" style="color:var(--fg)"></button>
          <button class="play" id="play" type="button" aria-label="Redare"></button>
          <button class="icon" id="next" type="button" aria-label="Piesa următoare" style="color:var(--fg)"></button>
          <button class="icon" id="repeat" type="button" aria-label="Fără repetare"></button>
        </div>
        <div class="vol">
          <button id="mute" type="button" aria-label="Oprește sunetul" class="icon" style="width:28px;height:28px"></button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volum">
        </div>
        <p class="note" id="note"></p>
      </div>
    </section>
    <section class="card">
      <div class="plist-head">
        <div><div class="sub">Playlist</div><div id="count">0 piese</div></div>
        <div id="clearBox"><button class="linkish" id="clear" type="button" disabled>Golește lista</button></div>
      </div>
      <label class="search"><input id="q" placeholder="Caută în bibliotecă" aria-label="Caută în bibliotecă"></label>
      <ul id="list"></ul>
      <p class="foot">100% offline. Spațiu redă sau întrerupe. Săgețile derulează piesa.</p>
    </section>
  </div>
  <input id="file" class="hidden" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.webm" multiple>
  <input id="dir" class="hidden" type="file" multiple>
  <audio id="audio" preload="metadata"></audio>
  <script>
    const ICONS = {
      shuffle: '<svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>',
      prev: '<svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>',
      next: '<svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>',
      play: '<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg>',
      repeat: '<svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
      repeat1: '<svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>',
      vol: '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
      mute: '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>',
      trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
    };
    const DAYS = ["DUMINICĂ","LUNI","MARȚI","MIERCURI","JOI","VINERI","SÂMBĂTĂ"];
    const MONTHS = ["IAN","FEB","MAR","APR","MAI","IUN","IUL","AUG","SEP","OCT","NOV","DEC"];
    const EXT = /\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|webm|mp4|aiff|aif)$/i;
    const KEY = "militar-player-settings";
    const $=id=>document.getElementById(id);
    const audio=$("audio");
    let tracks=[], currentId=null, settings=loadSettings(), urls=new Map(), order=[], seeking=false, loadedId=null;
    let audioCtx=null, analyser=null, sourceNode=null, freq=null, token=0;
    $("shuffle").innerHTML=ICONS.shuffle; $("prev").innerHTML=ICONS.prev; $("next").innerHTML=ICONS.next;
    $("play").innerHTML=ICONS.play; $("repeat").innerHTML=ICONS.repeat; $("mute").innerHTML=ICONS.vol;
    const bars=$("bars");
    for(let i=0;i<24;i++) bars.appendChild(document.createElement("i"));
    $("dir").setAttribute("webkitdirectory",""); $("dir").setAttribute("directory","");
    function loadSettings(){ try { const p=JSON.parse(localStorage.getItem(KEY)||"null")||{}; return { volume:clamp(p.volume??0.9), muted:!!p.muted, shuffle:!!p.shuffle, repeat:["off","all","one"].includes(p.repeat)?p.repeat:"off", lastId:p.lastId||null, lastTime:p.lastTime||0 }; } catch { return {volume:.9,muted:false,shuffle:false,repeat:"off",lastId:null,lastTime:0}; } }
    function saveSettings(p){ settings={...settings,...p}; localStorage.setItem(KEY, JSON.stringify(settings)); }
    function clamp(n){ return Math.min(1, Math.max(0, Number(n)||0)); }
    function fmt(s){ if(!Number.isFinite(s)||s<0) return "0:00"; s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return h? h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0") : m+":"+String(sec).padStart(2,"0"); }
    function parseName(name){ const base=name.replace(/\.[^.]+$/,"").replace(/_+/g," ").trim(); const parts=base.split(/\s[-–—]\s/); if(parts.length>=2) return {artist:parts[0].trim(), title:parts.slice(1).join(" - ").trim()}; return {artist:"Bibliotecă locală", title:base||name}; }
    function isAudio(f){ return f.type.startsWith("audio/") || EXT.test(f.name); }
    function openDb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("militar-player",1); r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"id"}); if(!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs",{keyPath:"id"}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    function done(tx){ return new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
    async function listTracks(){ const db=await openDb(); const tx=db.transaction("meta","readonly"); const req=tx.objectStore("meta").getAll(); const rows=await new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result||[]); req.onerror=()=>rej(req.error); }); await done(tx); db.close(); return rows.sort((a,b)=>a.addedAt-b.addedAt); }
    async function getBlob(id){ const db=await openDb(); const tx=db.transaction("blobs","readonly"); const req=tx.objectStore("blobs").get(id); const row=await new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); await done(tx); db.close(); return row?.blob||null; }
    async function putFiles(files){ const existing=await listTracks(); const known=new Set(existing.map(t=>t.fileName+"::"+t.size)); const fresh=[...files].filter(f=>{ if(!isAudio(f)) return false; const k=f.name+"::"+f.size; if(known.has(k)) return false; known.add(k); return true; }); const skipped=[...files].filter(isAudio).length-fresh.length; if(!fresh.length) return {added:0, skipped}; const db=await openDb(); const tx=db.transaction(["meta","blobs"],"readwrite"); const now=Date.now(); fresh.forEach((file,i)=>{ const id=crypto.randomUUID(); const n=parseName(file.name); tx.objectStore("meta").put({id, title:n.title, artist:n.artist, fileName:file.name, mime:file.type||"audio/*", size:file.size, addedAt:now+i, duration:0}); tx.objectStore("blobs").put({id, blob:file}); }); await done(tx); db.close(); return {added:fresh.length, skipped:Math.max(0,skipped)}; }
    async function removeId(id){ const db=await openDb(); const tx=db.transaction(["meta","blobs"],"readwrite"); tx.objectStore("meta").delete(id); tx.objectStore("blobs").delete(id); await done(tx); db.close(); }
    async function clearAll(){ const db=await openDb(); const tx=db.transaction(["meta","blobs"],"readwrite"); tx.objectStore("meta").clear(); tx.objectStore("blobs").clear(); await done(tx); db.close(); }
    async function saveDuration(id, duration){ if(!(duration>0)) return; const db=await openDb(); const tx=db.transaction("meta","readwrite"); const store=tx.objectStore("meta"); const cur=await new Promise((res,rej)=>{ const r=store.get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); if(cur) store.put({...cur, duration}); await done(tx); db.close(); }
    function note(text, err){ const el=$("note"); el.textContent=text||""; el.className="note"+(err?" err":""); if(text) setTimeout(()=>{ if(el.textContent===text) el.textContent=""; }, 4200); }
    function paintProgress(){
      const cur=tracks.find(t=>t.id===currentId);
      const d=Number.isFinite(audio.duration)&&audio.duration>0 ? audio.duration : (cur?.duration||0);
      const t=audio.currentTime||0;
      $("cur").textContent=fmt(t); $("dur").textContent=fmt(d);
      $("fill").style.width=(d? Math.min(100, t/d*100):0)+"%";
      $("seek").setAttribute("aria-valuemax", String(Math.round(d)||0));
      $("seek").setAttribute("aria-valuenow", String(Math.round(t)));
    }
    function paintTransport(){
      $("play").innerHTML = audio.paused ? ICONS.play : ICONS.pause;
      $("play").setAttribute("aria-label", audio.paused?"Redare":"Pauză");
      paintProgress();
    }
    function render(){
      const q=$("q").value.trim().toLowerCase();
      const visible=tracks.filter(t=>!q || (t.title+" "+t.artist+" "+t.fileName).toLowerCase().includes(q));
      $("count").textContent = tracks.length===1 ? "1 piesă" : tracks.length+" piese";
      $("clear").disabled=!tracks.length;
      const cur=tracks.find(t=>t.id===currentId);
      $("title").textContent = cur? cur.title : "Niciun fișier selectat";
      $("artist").textContent = cur? cur.artist : "Importă muzică pentru a începe";
      $("shuffle").classList.toggle("on", settings.shuffle);
      $("repeat").classList.toggle("on", settings.repeat!=="off");
      $("repeat").innerHTML = settings.repeat==="one" ? ICONS.repeat1 : ICONS.repeat;
      $("repeat").setAttribute("aria-label", settings.repeat==="one"?"Repetă piesa":settings.repeat==="all"?"Repetă lista":"Fără repetare");
      $("play").innerHTML = audio.paused ? ICONS.play : ICONS.pause;
      $("play").setAttribute("aria-label", audio.paused?"Redare":"Pauză");
      $("play").disabled=!tracks.length; $("prev").disabled=!tracks.length; $("next").disabled=!tracks.length; $("shuffle").disabled=!tracks.length;
      paintProgress();
      $("volume").value=settings.muted?0:settings.volume;
      $("mute").innerHTML = settings.muted||settings.volume===0 ? ICONS.mute : ICONS.vol;
      const list=$("list"); list.innerHTML="";
      if(!visible.length){
        const li=document.createElement("li"); li.className="empty";
        li.innerHTML = tracks.length ? "<strong>Nicio piesă nu corespunde căutării.</strong>" : "<strong>Biblioteca este goală.</strong>Trage fișierele aici sau folosește Importă. Muzica nu părăsește dispozitivul.<div><button class='cta' id='emptyImport' type='button'>Alege fișiere audio</button></div>";
        list.appendChild(li);
        li.querySelector("#emptyImport")?.addEventListener("click", ()=>$("file").click());
        return;
      }
      visible.forEach(track=>{
        const li=document.createElement("li"); if(track.id===currentId) li.className="active";
        const index=String(tracks.indexOf(track)+1).padStart(2,"0");
        li.innerHTML=`<button class="row" type="button"><span class="idx">${index}</span><span style="min-width:0"><span class="ttl"></span><span class="art"></span></span></button><span class="dur">${track.duration>0?fmt(track.duration):"—"}</span><button type="button" aria-label="Șterge" class="icon">${ICONS.trash}</button>`;
        li.querySelector(".ttl").textContent=track.title; li.querySelector(".art").textContent=track.artist;
        li.querySelector(".row").onclick=()=>playId(track.id,0);
        li.querySelectorAll("button")[1].onclick=()=>del(track.id);
        list.appendChild(li);
      });
    }
    function ensureGraph(){ if(sourceNode) return; const Ctx=window.AudioContext||window.webkitAudioContext; audioCtx=new Ctx(); analyser=audioCtx.createAnalyser(); analyser.fftSize=64; analyser.smoothingTimeConstant=.78; sourceNode=audioCtx.createMediaElementSource(audio); sourceNode.connect(analyser); analyser.connect(audioCtx.destination); freq=new Uint8Array(analyser.frequencyBinCount); }
    async function playId(id, offset){ const my=++token; const blob=await getBlob(id); if(!blob||my!==token) return; let url=urls.get(id); if(!url){ url=URL.createObjectURL(blob); urls.set(id,url); } currentId=id; loadedId=id; if(audio.src!==url){ audio.src=url; if(offset>0.4) audio.addEventListener("loadedmetadata", function once(){ audio.currentTime=offset; audio.removeEventListener("loadedmetadata", once); }); } else if(offset>0.4) audio.currentTime=offset;
      try { ensureGraph(); await audioCtx.resume(); await audio.play(); if(my!==token) return; saveSettings({lastId:id, lastTime:offset||0}); note(""); } catch { note("Redarea a fost blocată. Apasă din nou pe play.", true); }
      render();
    }
    function pickNext(fromEnded){ if(!tracks.length) return null; if(fromEnded && settings.repeat==="one" && currentId) return currentId; if(!currentId) return tracks[0].id; if(settings.shuffle){ order=order.filter(id=>tracks.some(t=>t.id===id)); if(order.length<=1){ order=tracks.map(t=>t.id).sort(()=>Math.random()-.5); if(order[0]===currentId && order.length>1) order.push(order.shift()); } const i=order.indexOf(currentId); let next=i<0?order[0]:order[i+1]; if(!next){ if(fromEnded && settings.repeat==="off") return null; order=tracks.map(t=>t.id).sort(()=>Math.random()-.5); next=order[0]; } return next; } const i=tracks.findIndex(t=>t.id===currentId); if(tracks[i+1]) return tracks[i+1].id; if(fromEnded && settings.repeat==="off") return null; return tracks[0].id; }
    function go(dir, fromEnded){ if(dir===1){ const id=pickNext(!!fromEnded); if(!id){ audio.pause(); render(); return; } if(fromEnded && settings.repeat==="one" && id===currentId){ audio.currentTime=0; audio.play(); return; } playId(id,0); return; } if(audio.currentTime>3){ audio.currentTime=0; return; } const i=Math.max(0, tracks.findIndex(t=>t.id===currentId)); const prev=tracks[(i-1+tracks.length)%tracks.length]; if(prev) playId(prev.id,0); }
    async function importFiles(list){ const files=[...list]; if(!files.length) return; try { const result=await putFiles(files); tracks=await listTracks(); if(!currentId && tracks[0]) currentId=tracks[0].id; if(result.added===0 && result.skipped>0) note("Piesele există deja în bibliotecă."); else if(result.added===0) note("Niciun fișier audio recunoscut."); else note(result.added===1?"O piesă a fost adăugată pe acest dispozitiv.":result.added+" piese au fost adăugate pe acest dispozitiv."); scanDurations(); } catch { note("Importul a eșuat. Încearcă din nou.", true); } render(); }
    async function del(id){ await removeId(id); const url=urls.get(id); if(url){ URL.revokeObjectURL(url); urls.delete(id); } tracks=tracks.filter(t=>t.id!==id); if(currentId===id){ audio.pause(); audio.removeAttribute("src"); loadedId=null; currentId=tracks[0]?.id||null; saveSettings({lastId:currentId, lastTime:0}); } render(); }
    async function wipe(){ await clearAll(); urls.forEach(u=>URL.revokeObjectURL(u)); urls.clear(); audio.pause(); audio.removeAttribute("src"); audio.load(); tracks=[]; currentId=null; loadedId=null; saveSettings({lastId:null, lastTime:0}); $("clearBox").innerHTML='<button class="linkish" id="clear" type="button" disabled>Golește lista</button>'; bindClear(); render(); }
    function bindClear(){ $("clear").onclick=()=>{ $("clearBox").innerHTML='<button class="linkish" id="cancelClear" type="button">Anulează</button><button class="danger" id="doClear" type="button">Golește</button>'; $("cancelClear").onclick=()=>{ $("clearBox").innerHTML='<button class="linkish" id="clear" type="button">Golește lista</button>'; bindClear(); }; $("doClear").onclick=()=>wipe(); }; }
    function tickClock(){ const now=new Date(); $("clock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0"); $("date").textContent=now.getDate()+" "+MONTHS[now.getMonth()]+" "+now.getFullYear(); $("day").textContent=DAYS[now.getDay()]; }
    function draw(){ requestAnimationFrame(draw); const nodes=bars.children; const live=!audio.paused && analyser; if(live) analyser.getByteFrequencyData(freq); for(let i=0;i<nodes.length;i++){ const sample=live? freq[i]/255 : .16; nodes[i].style.transform="scaleY("+Math.max(.12, sample)+")"; nodes[i].style.opacity=live?"1":".45"; } }
    async function scanDurations(){ for(const track of tracks){ if(track.duration>0) continue; const blob=await getBlob(track.id); if(!blob) continue; const len=await new Promise(res=>{ const u=URL.createObjectURL(blob); const a=new Audio(); const fin=n=>{URL.revokeObjectURL(u); res(n);}; a.preload="metadata"; a.onloadedmetadata=()=>fin(Number.isFinite(a.duration)?a.duration:0); a.onerror=()=>fin(0); a.src=u; }); if(len>0){ track.duration=len; await saveDuration(track.id, len); render(); } } }
    function seekAt(clientX, rect){ if(!(audio.duration>0)) return; const ratio=Math.min(1, Math.max(0,(clientX-rect.left)/rect.width)); audio.currentTime=ratio*audio.duration; paintProgress(); }
    $("importBtn").onclick=()=>$("file").click();
    $("dirBtn").onclick=()=>$("dir").click();
    $("file").onchange=e=>{ importFiles(e.target.files); e.target.value=""; };
    $("dir").onchange=e=>{ importFiles(e.target.files); e.target.value=""; };
    $("play").onclick=()=>{ const id=currentId||tracks[0]?.id; if(!id) return; if(loadedId!==id) playId(id, currentId===id?settings.lastTime:0); else if(audio.paused){ ensureGraph(); audioCtx?.resume(); audio.play().catch(()=>note("Redarea a fost blocată. Apasă din nou pe play.", true)); } else audio.pause(); };
    $("next").onclick=()=>go(1,false); $("prev").onclick=()=>go(-1,false);
    $("shuffle").onclick=()=>{ saveSettings({shuffle:!settings.shuffle}); order=[]; render(); };
    $("repeat").onclick=()=>{ const next=settings.repeat==="off"?"all":settings.repeat==="all"?"one":"off"; saveSettings({repeat:next}); render(); };
    $("volume").oninput=e=>{ const v=Number(e.target.value); saveSettings({volume:v, muted:v===0}); audio.volume=v; render(); };
    $("mute").onclick=()=>{ const muted=!settings.muted; saveSettings({muted}); audio.volume=muted?0:(settings.volume||.9); render(); };
    $("q").oninput=render;
    audio.ontimeupdate=()=>{ if(!seeking) paintProgress(); };
    audio.onplay=paintTransport; audio.onpause=paintTransport;
    audio.onloadedmetadata=()=>{ const cur=tracks.find(t=>t.id===currentId); if(cur && audio.duration>0){ cur.duration=audio.duration; saveDuration(cur.id, audio.duration); } render(); };
    audio.onended=()=>go(1,true);
    const seek=$("seek");
    seek.onpointerdown=e=>{ seeking=true; seek.setPointerCapture(e.pointerId); seekAt(e.clientX, seek.getBoundingClientRect()); };
    seek.onpointermove=e=>{ if(seeking) seekAt(e.clientX, seek.getBoundingClientRect()); };
    seek.onpointerup=()=>{ seeking=false; };
    const drop=$("drop");
    drop.ondragover=e=>{ e.preventDefault(); };
    drop.ondrop=e=>{ e.preventDefault(); importFiles(e.dataTransfer.files); };
    addEventListener("keydown", e=>{ const tag=document.activeElement?.tagName; if(tag==="INPUT"||tag==="TEXTAREA") return; if(e.code==="Space"){ e.preventDefault(); $("play").click(); } else if(e.code==="ArrowRight"){ audio.currentTime=Math.min(audio.duration||0, audio.currentTime+5); } else if(e.code==="ArrowLeft"){ audio.currentTime=Math.max(0, audio.currentTime-5); } });
    setInterval(()=>{ if(!audio.paused && currentId) saveSettings({lastId:currentId, lastTime:audio.currentTime||0}); }, 2000);
    setInterval(tickClock, 1000); tickClock();
    bindClear();
    audio.volume=settings.muted?0:settings.volume;
    listTracks().then(rows=>{ tracks=rows; if(settings.lastId && rows.some(t=>t.id===settings.lastId)) currentId=settings.lastId; else if(rows[0]) currentId=rows[0].id; render(); scanDurations(); }).catch(()=>{ note("Biblioteca locală nu a putut fi deschisă.", true); render(); });
    requestAnimationFrame(draw);
    if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
    if("mediaSession" in navigator){ const bind=(a,fn)=>{ try{ navigator.mediaSession.setActionHandler(a, fn); }catch{} }; setInterval(()=>{ const cur=tracks.find(t=>t.id===currentId); if(!cur) return; navigator.mediaSession.metadata=new MediaMetadata({title:cur.title, artist:cur.artist, album:"MILITAR Player"}); document.title = audio.paused ? "MILITAR Player" : cur.title+" — MILITAR"; }, 1000); bind("play", ()=>$("play").click()); bind("pause", ()=>audio.pause()); bind("nexttrack", ()=>go(1,false)); bind("previoustrack", ()=>go(-1,false)); }
  </script>
</body>
